
spring:
  application:
    name: campusconnect

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campusconnect}
    username: ${DB_USERNAME:campusconnect}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080
