server:
  port: 8080

spring:
  application:
    name: campusconnect

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campusconnect}
    username: ${DB_USERNAME:campusconnect}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
