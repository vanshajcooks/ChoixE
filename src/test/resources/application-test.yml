spring:
  application:
    name: campusconnect-test

  datasource:
    url: jdbc:h2:mem:campusconnect_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: true
    database-platform: org.hibernate.dialect.H2Dialect

  thymeleaf:
    cache: false
